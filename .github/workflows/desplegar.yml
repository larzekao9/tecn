# Despliegue continuo: cada push a main compila el frontend (React) y el backend (Laravel) y los sube al
# servidor del curso (tecnoweb) por FTP como un solo zip, que descomprimir.php abre alla.
#
# NO toca la base de datos: no migra, no siembra, no borra nada. La configuracion del servidor (laravel/.env)
# ya esta en el servidor y no se pisa. Si alguna vez hay que preparar la BD se hace a mano
# (desplegar/empaquetar.ps1 -Instalar).
#
# Antes de subir comprueba que el servidor responde y que la base de datos esta en pie y con sus tablas;
# si algo falla se detiene SIN subir nada y el motivo aparece en rojo en la pestaña Actions (y GitHub
# manda un correo). Despues de subir vuelve a comprobar que la app, la API y la base de datos responden.
#
# Configuracion en GitHub (Settings > Secrets and variables > Actions):
#   variables: FTP_HOST, FTP_USUARIO, FTP_CARPETA (ej. /proyecto2), SITIO_URL (ej. https://www.tecnoweb.org.bo),
#              WEB_BASE (ruta de la app en el sitio, ej. /inf513/grupo12sa/proyecto2/)
#   secreto:   FTP_CLAVE
name: Desplegar en tecnoweb

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desplegar-tecnoweb
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FTP_HOST: ${{ vars.FTP_HOST }}
      FTP_USUARIO: ${{ vars.FTP_USUARIO }}
      FTP_CARPETA: ${{ vars.FTP_CARPETA }}
      SITIO_URL: ${{ vars.SITIO_URL }}
      WEB_BASE: ${{ vars.WEB_BASE }}
      FTP_CLAVE: ${{ secrets.FTP_CLAVE }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar configuracion
        run: |
          for v in FTP_HOST FTP_USUARIO FTP_CARPETA SITIO_URL WEB_BASE FTP_CLAVE; do
            [ -n "${!v}" ] || { echo "::error::Falta la variable o secreto $v en GitHub"; exit 1; }
          done
          URL="${SITIO_URL%/}/${WEB_BASE#/}"
          echo "URL=${URL%/}" >> "$GITHUB_ENV"

      # ---------- Antes de subir: servidor y base de datos ----------
      - name: Verificar servidor y base de datos (antes de subir)
        run: bash .github/scripts/salud.sh antes

      # ---------- Capa 1: frontend ----------
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capa1-presentacion/package-lock.json
      - name: Compilar frontend
        working-directory: capa1-presentacion
        run: |
          npm ci --no-audit --no-fund
          npx vite build --outDir "$RUNNER_TEMP/web" --emptyOutDir

      # ---------- Capa 2: backend ----------
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, zip, mbstring
          tools: composer:v2
          coverage: none
      - name: Preparar backend (sin dependencias de desarrollo, logs ni .env; solo los videos de demostracion)
        run: |
          L="$RUNNER_TEMP/web/laravel"
          mkdir -p "$L"
          rsync -a capa2-negocio/ "$L/" \
            --exclude vendor --exclude node_modules --exclude tests --exclude docker --exclude public \
            --exclude 'storage/app/private/videos' --exclude 'storage/logs' --exclude 'storage/framework' \
            --exclude '.env' --exclude '.env.example' --exclude '.env.backup' --exclude Dockerfile \
            --exclude '*.log' --exclude 'bootstrap/cache/*.php'
          mkdir -p "$L/storage/app/private/videos" "$L/storage/logs" "$L/storage/framework/cache/data" \
                   "$L/storage/framework/sessions" "$L/storage/framework/views" "$L/storage/framework/testing"
          # videos de demostracion (los de los materiales sembrados); los que suben los usuarios en el servidor no se tocan
          cp -r capa2-negocio/storage/app/private/videos/demo "$L/storage/app/private/videos/demo"
          echo "videos de demostracion: $(ls "$L/storage/app/private/videos/demo" | wc -l)"
          cd "$L"
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          cd -
          cp desplegar/plantillas/index.php "$RUNNER_TEMP/web/index.php"
          cp desplegar/plantillas/raiz.htaccess "$RUNNER_TEMP/web/.htaccess"
          cp desplegar/plantillas/laravel.htaccess "$L/.htaccess"

      - name: Empaquetar
        run: |
          cd "$RUNNER_TEMP/web"
          zip -qr "$RUNNER_TEMP/canal11.zip" .
          CLAVE=$(openssl rand -hex 16)
          echo "::add-mask::$CLAVE"
          echo "CLAVE=$CLAVE" >> "$GITHUB_ENV"
          sed "s/__CLAVE__/$CLAVE/" "$GITHUB_WORKSPACE/desplegar/plantillas/descomprimir.php" > "$RUNNER_TEMP/descomprimir.php"
          ls -lh "$RUNNER_TEMP/canal11.zip"

      # ---------- Subida (solo codigo: frontend y backend) ----------
      - name: Subir por FTP
        run: |
          FTP="ftp://$FTP_HOST/${FTP_CARPETA#/}"
          for f in canal11.zip descomprimir.php; do
            echo "subiendo $f"
            curl -sS --fail --retry 3 --connect-timeout 30 --ftp-create-dirs --ftp-pasv --user "$FTP_USUARIO:$FTP_CLAVE" \
              -T "$RUNNER_TEMP/$f" "${FTP%/}/$f" \
              || { echo "::error::No se pudo subir $f por FTP (servidor FTP caido o credenciales)"; exit 1; }
          done

      - name: Descomprimir en el servidor
        run: |
          curl -sS -L --fail --max-time 900 "$URL/descomprimir.php?clave=$CLAVE" | tee salida.txt \
            || { echo "::error::El servidor no pudo descomprimir el paquete"; exit 1; }
          grep -q 'Descomprimidos' salida.txt || { echo "::error::El servidor no confirmo la descompresion"; exit 1; }

      # ---------- Despues de subir: todo responde ----------
      - name: Comprobar que responde (despues de subir)
        run: bash .github/scripts/salud.sh despues
